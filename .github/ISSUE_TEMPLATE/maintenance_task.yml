name: Maintenance task
description: Propose repository cleanup, automation, category work, or release maintenance.
title: "Maintenance: "
labels: ["maintenance", "triage"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the maintenance work and why it improves the collection.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the files, categories, or workflow areas affected.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true before this can be closed?
    validations:
      required: true
